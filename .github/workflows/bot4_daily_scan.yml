name: BOT 4 Thai Stocks Pullback Scanner

on:
  schedule:
    # รันอัตโนมัติเวลา 17:25 น. เวลาไทย (10:25 UTC จันทร์-ศุกร์ หลังตลาดหุ้นไทยปิด 16:30 น. - เหลื่อมเวลาเพื่อเลี่ยง race condition)
    - cron: "25 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan_and_notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Bot 4 Thai Scanner & Risk Manager
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT4_TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BOT4_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot4_thai_pullback.src.main

      - name: Commit Dashboard & State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot4_thai_pullback/config/
          git add bot4_thai_pullback/docs/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update Bot 4 Thai Pullback dashboard & state [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break || sleep $((RANDOM % 5 + 2))
            done
          fi

      - name: Send Failure Notification to Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT4_TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BOT4_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "parse_mode=HTML" \
              -d "text=🚨 <b>BOT 4 EXECUTION FAILED!</b>%0AWorkflow: <code>Bot 4 Thai Daily Scan</code>%0AStatus: <code>CRITICAL FAILURE</code>%0APlease inspect GitHub Actions run logs."
          fi


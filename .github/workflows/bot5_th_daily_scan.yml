name: BOT 5 Thai Hybrid Master Scanner

on:
  schedule:
    # รันอัตโนมัติเวลา 17:30 น. เวลาไทย (10:30 UTC จันทร์-ศุกร์)
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan_and_notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Bot 5 Thai Hybrid Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT5_TH_TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot5_thai_hybrid.src.main

      - name: Commit Dashboard & Config State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot5_thai_hybrid/config/
          git add bot5_thai_hybrid/docs/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update Bot 5 Thai dashboard & state [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break || sleep $((RANDOM % 5 + 2))
            done
          fi

name: Master Forward Test Dashboard Builder

on:
  schedule:
    # 09:00 BKK (02:00 UTC) every Mon-Sat (after US market closes)
    - cron: "0 2 * * 1-6"
    # 17:45 BKK (10:45 UTC) every Mon-Fri (after Thai market closes)
    - cron: "45 10 * * 1-5"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "US Stocks 6-Button Daily Scanner"
      - "BOT 3 US Trend Pullback Scanner"
      - "BOT 4 Thai Stocks Pullback Scanner"
      - "BOT 5 US Hybrid Master Scanner"
      - "BOT 5 Thai Hybrid Master Scanner"
    types:
      - completed

permissions:
  contents: write

jobs:
  build_dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Copy Sub-Dashboards to docs/
        run: |
          mkdir -p docs
          if [ -f "docs/index.html" ] && [ ! -f "docs/bot1.html" ]; then cp docs/index.html docs/bot1.html; fi
          if [ -f "bot3_pullback/docs/index.html" ]; then cp bot3_pullback/docs/index.html docs/bot3.html; fi
          if [ -f "bot4_thai_pullback/docs/index.html" ]; then cp bot4_thai_pullback/docs/index.html docs/bot4.html; fi
          if [ -f "bot5_us_hybrid/docs/index.html" ]; then cp bot5_us_hybrid/docs/index.html docs/bot5.html; fi
          if [ -f "bot5_thai_hybrid/docs/index.html" ]; then cp bot5_thai_hybrid/docs/index.html docs/bot6.html; fi

      - name: Build 6-Bot Master Dashboard
        run: python src/build_master_dashboard.py

      - name: Commit & Publish Dashboard to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update 6-Bot Master Dashboard [skip ci]"
            git pull --rebase origin main || true
            git push
          fi

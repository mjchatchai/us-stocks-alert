name: US Stocks 6-Button Daily Scanner

on:
  schedule:
    # รันอัตโนมัติเวลา 08:42 น. เวลาไทย (01:42 UTC จันทร์-เสาร์ ช่วงทราฟฟิกต่ำและหลบนาที :00)
    - cron: "42 1 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan_and_notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Sync Telegram Commands & Run 6-Button Strategy Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/scanner.py

      - name: Save Portfolio State & Update Web Dashboard (GitHub Pages)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/watchlist.json
          if [ -d "docs" ]; then git add docs/; fi
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update 3-zone dashboard & portfolio state [skip ci]"
            git pull --rebase origin main || true
            git push
          fi

name: US Stocks 6-Button Daily Scanner

on:
  schedule:
    # รันอัตโนมัติเวลา 10:00 น. เวลาไทย (03:00 UTC อังคาร-เสาร์ หลังตลาดหุ้น US ปิดของคืนจันทร์-ศุกร์)
    - cron: "0 3 * * 2-6"
  workflow_dispatch: # กดสั่งรันเองได้ทุกเมื่อจากหน้าเว็บหรือแอป GitHub บนมือถือ

permissions:
  contents: write

jobs:
  scan_and_notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Sync Telegram Commands & Run 6-Button Strategy Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/scanner.py

      - name: Save Portfolio State & Update Web Dashboard (GitHub Pages)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/watchlist.json docs/
          git diff --staged --quiet || git commit -m "Auto-update 3-zone dashboard & portfolio state [skip ci]"
          git push

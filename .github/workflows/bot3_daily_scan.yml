name: BOT 3 US Trend Pullback Scanner

on:
  schedule:
    # รันอัตโนมัติเวลา 08:45 น. เวลาไทย (01:45 UTC จันทร์-เสาร์)
    - cron: "45 1 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan_and_notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Bot 3 Scanner & Risk Manager
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT3_TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BOT3_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot3_pullback.src.main

      - name: Commit Dashboard & Config State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot3_pullback/config/
          git add bot3_pullback/docs/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update Bot 3 pullback dashboard & state [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break || sleep $((RANDOM % 5 + 2))
            done
          fi

      - name: Notify Failure Alert
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT3_TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BOT3_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, requests
          token = os.getenv('TELEGRAM_BOT_TOKEN')
          chat_id = os.getenv('TELEGRAM_CHAT_ID')
          if token and chat_id:
              msg = '🚨 <b>BOT 3 PIPELINE FAILURE ALERT</b>\nGitHub Actions workflow failed.\nPlease inspect the run logs.'
              requests.post(f'https://api.telegram.org/bot{token}/sendMessage', json={'chat_id': chat_id, 'text': msg, 'parse_mode': 'HTML'}, timeout=10)
          "
